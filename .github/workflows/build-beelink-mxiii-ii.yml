name: OpenWrt для Beelink Mini MXIII-II (S905X, p212)

# Железо: Amlogic S905X, плата p212, 2 ГБ RAM, 16 ГБ eMMC, Ethernet 1 порт,
# Wi-Fi AW-CM273SM. Заводская прошивка: Android 6.0.1, ядро 3.14.29.
# DTB: meson-gxl-s905x-p212.dtb (по умолчанию для s905x в образах ophub).

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "Версия официального OpenWrt (rootfs armsr/armv8)"
        required: true
        default: "24.10.2"
      kernel:
        description: "Ядро Linux (ветка): 6.12.y или 6.6.y"
        required: true
        default: "6.12.y"
      rootfs_size:
        description: "Размер корневого раздела, МБ (eMMC 16 ГБ, хватит с запасом)"
        required: true
        default: "1024"
      hostname:
        description: "Имя устройства в сети"
        required: true
        default: "Beelink-MXIII-II"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Скачать официальный rootfs OpenWrt (armsr/armv8)
        run: |
          V="${{ inputs.openwrt_version }}"
          mkdir -p openwrt-armsr
          wget -q -O openwrt-armsr/openwrt-armsr-armv8-rootfs.tar.gz \
            "https://downloads.openwrt.org/releases/${V}/targets/armsr/armv8/openwrt-${V}-armsr-armv8-generic-rootfs.tar.gz"
          ls -lh openwrt-armsr

      - name: Настройки по умолчанию для этой приставки
        run: |
          mkdir rootfs-tmp
          sudo tar -xzf openwrt-armsr/openwrt-armsr-armv8-rootfs.tar.gz -C rootfs-tmp
          sudo mkdir -p rootfs-tmp/etc/uci-defaults
          sudo tee rootfs-tmp/etc/uci-defaults/99-beelink >/dev/null <<'EOF'
          #!/bin/sh
          uci set system.@system[0].hostname='${{ inputs.hostname }}'
          uci set system.@system[0].timezone='UTC'
          uci commit system
          exit 0
          EOF
          sudo chmod +x rootfs-tmp/etc/uci-defaults/99-beelink
          sudo tar -czf openwrt-armsr/openwrt-armsr-armv8-rootfs.tar.gz -C rootfs-tmp .

      - name: Упаковать образ для S905X (p212)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt-armsr/*rootfs.tar.gz
          openwrt_board: s905x
          openwrt_kernel: ${{ inputs.kernel }}
          auto_kernel: true
          openwrt_size: ${{ inputs.rootfs_size }}

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beelink-mxiii-ii-${{ inputs.openwrt_version }}-${{ github.run_number }}
          name: OpenWrt ${{ inputs.openwrt_version }} для Beelink Mini MXIII-II (kernel ${{ inputs.kernel }})
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          body: |
            Образ для Beelink Mini MXIII-II (Amlogic S905X, плата p212).
            DTB: meson-gxl-s905x-p212.dtb
            Запись на флешку, загрузка через кнопку update, потом openwrt-install-amlogic.
